<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑发布 - 校园失物招领</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/publish.css">
</head>
<body>
  <div class="phone-screen publish-screen">
    <main class="publish-page edit-page" aria-labelledby="edit-title">
      <a class="page-back page-back-icon" href="./profile.html" aria-label="返回我的" title="返回我的"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></a>
      <h1 id="edit-title">编辑发布</h1>
      <form id="edit-form" novalidate>
        <fieldset class="type-switch"><legend class="sr-only">信息类型</legend><label><input type="radio" name="type" value="lost"><span>寻物</span></label><label><input type="radio" name="type" value="found"><span>招领</span></label></fieldset>
        <div class="field-grid"><label class="form-field"><span>物品名称 <b>*</b></span><input name="title" maxlength="40" required placeholder="请输入物品名称"><small data-error="title"></small></label><label class="form-field"><span>分类 <b>*</b></span><select name="category" required><option value="">请选择</option><option>证件</option><option>数码</option><option>钥匙</option><option>生活用品</option><option>书籍</option><option>其他</option></select><small data-error="category"></small></label></div>
        <div class="form-field image-field"><span>物品图片</span><div class="image-upload-grid" data-image-grid aria-label="物品图片，最多 3 张"><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="1" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="2" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="3" type="file" accept="image/jpeg,image/png,image/webp"></label></div><small data-error="image"></small></div>
        <label class="form-field"><span>特征描述 <b>*</b></span><textarea name="description" maxlength="240" required></textarea><small data-error="description"></small></label>
        <div class="field-grid location-time-grid"><label class="form-field"><span>时间 <b>*</b></span><input id="publish-date" name="date" type="date" required><small data-error="date"></small></label><div class="form-field location-field"><span>地点 <b>*</b></span><div class="location-picker" data-location-picker><input id="publish-location" name="location" type="hidden"><button class="location-trigger" type="button" aria-expanded="false" aria-controls="publish-location-menu"><span data-location-label>填写校内地点</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="location-menu" id="publish-location-menu" data-location-menu hidden><div class="location-groups" data-location-groups></div><div class="location-custom"><label for="publish-custom-location">自定义地点</label><div class="location-custom-row"><input id="publish-custom-location" type="text" maxlength="40" placeholder="输入校内地点"><button type="button" data-location-custom-confirm>确定</button></div></div></div></div><small data-error="location"></small></div><label class="location-detail-field" for="publish-location-detail"><span>具体位置 <b>*</b></span><input id="publish-location-detail" class="location-detail-input" name="locationDetail" maxlength="60" required placeholder="例如：二楼自习区、靠窗座位"><small data-error="locationDetail"></small></label></div>
        <label class="form-field"><span>联系方式（电话） <b>*</b></span><input name="contact" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" pattern="1[3-9][0-9]{9}" required placeholder="请输入11位手机号"><small data-error="contact"></small></label>
        <p id="edit-form-message" class="form-message" role="alert"></p><button class="primary-button" type="submit">保存修改</button>
      </form>
    </main>
    <nav class="app-bottom-nav" aria-label="底部导航"><a class="bottom-nav-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>首页</a><a class="bottom-nav-link publish-nav" href="./publish.html"><span class="nav-plus" aria-hidden="true">＋</span>发布</a><a class="bottom-nav-link active" href="./profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a></nav>
  </div>
  <script src="../js/data.js?v=12"></script><script src="../js/publish.js?v=5"></script><script src="../js/edit-post.js?v=4"></script>
</body>
</html>
