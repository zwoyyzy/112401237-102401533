<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光 | 校园失物招领</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/design-system.css">
</head>
<body class="home-page">
  <div class="phone-screen">
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="拾光首页">
      <span class="brand-mark">拾</span>
      <span><strong>校园拾光</strong><small>让每一件失物，都能找到回家的路</small></span>
    </a>
    <nav class="top-nav" aria-label="主导航">
      <a class="nav-link active" href="./index.html">首页</a>
      <a class="nav-link" href="./pages/search.html">发现</a>
      <a class="nav-link" href="./pages/publish.html">发布信息</a>
      <a class="nav-link" href="./pages/profile.html">我的</a>
    </nav>
    <a class="header-action" href="./pages/publish.html"><span>＋</span> 发布信息</a>
  </header>

  <main class="home-shell">
    <section class="hero-panel">
      <div class="hero-banner-art" aria-hidden="true">
        <img src="./assets/home-hero.png" alt="校园拾光校园失物招领" width="1940" height="811">
      </div>
      <div class="hero-copy">
        <h1 class="visually-hidden">校园失物招领</h1>
        <form class="hero-search" action="./pages/search.html" method="get">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input name="keyword" type="search" placeholder="搜索物品名称，例如：校园卡、雨伞" aria-label="搜索物品名称">
          <button type="submit">开始搜索</button>
        </form>
        <div class="quick-tags" aria-label="热门搜索">
          <span>大家都在找</span>
          <a href="./pages/search.html?keyword=校园卡">校园卡</a>
          <a href="./pages/search.html?keyword=耳机">耳机</a>
          <a href="./pages/search.html?keyword=雨伞">雨伞</a>
        </div>
      </div>
      <div class="hero-art" aria-label="失物招领插画">
        <div class="art-card art-card-back"></div>
        <div class="art-card art-card-main">
          <span class="art-badge">今日新发布</span>
          <div class="art-object">🎧</div>
          <strong>白色无线耳机</strong>
          <span>图书馆 · 10月4日</span>
        </div>
        <div class="art-note">一条信息<br><b>连接</b>一次重逢</div>
      </div>
    </section>

    <section class="board-toolbar" aria-label="信息类型">
      <div class="segmented-control" role="tablist" aria-label="信息类型筛选">
        <button class="segment active" data-home-filter="all" role="tab" aria-selected="true">全部</button>
        <button class="segment" data-home-filter="lost" role="tab" aria-selected="false">寻物</button>
        <button class="segment" data-home-filter="found" role="tab" aria-selected="false">招领</button>
      </div>
      <span class="result-count" id="home-result-count">正在加载</span>
    </section>

    <section class="category-toolbar" aria-label="物品分类">
      <button class="category-scroll-back" type="button" aria-label="返回前面的分类" hidden>‹</button>
      <div class="category-scroll" role="tablist" aria-label="物品分类筛选">
        <button class="category-filter active" data-home-category="all" role="tab" aria-selected="true">全部</button>
        <button class="category-filter" data-home-category="证件" role="tab" aria-selected="false">证件</button>
        <button class="category-filter" data-home-category="数码" role="tab" aria-selected="false">数码</button>
        <button class="category-filter" data-home-category="钥匙" role="tab" aria-selected="false">钥匙</button>
        <button class="category-filter" data-home-category="生活用品" role="tab" aria-selected="false">生活用品</button>
        <button class="category-filter" data-home-category="书籍" role="tab" aria-selected="false">书籍</button>
        <button class="category-filter" data-home-category="其他" role="tab" aria-selected="false">其他</button>
      </div>
      <button class="category-scroll-cue" type="button" aria-label="查看后续分类" hidden>›</button>
    </section>

    <section class="item-grid" id="home-item-grid" aria-live="polite"></section>
    <p class="empty-state hidden" id="home-empty">这里暂时没有符合条件的信息，换个分类试试吧。</p>
  </main>

  <nav class="app-bottom-nav" aria-label="底部导航">
    <a class="bottom-nav-link active" href="./index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>首页</a>
    <a class="bottom-nav-link publish-nav" href="./pages/publish.html"><span class="nav-plus" aria-hidden="true">＋</span>发布</a>
    <a class="bottom-nav-link" href="./pages/profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a>
  </nav>
  <footer class="site-footer">
    <span>拾光 · 让校园里的善意被看见</span>
    <span>© 2026 Campus Lost &amp; Found</span>
  </footer>
  </div>

  <script src="./js/data.js?v=15"></script>
  <script src="./js/card.js?v=4"></script>
  <script src="./js/home.js?v=5"></script>
</body>
</html>
